spring:
  application:
    name: shop

  # Default: in-memory H2 so the app runs with zero setup. Use --spring.profiles.active=postgres for Postgres.
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console  (JDBC URL above, user sa)

  jpa:
    open-in-view: false      # no lazy loading from controllers; views are built inside transactions
    hibernate:
      ddl-auto: validate     # Flyway owns the schema; Hibernate only checks the mapping matches it
    properties:
      hibernate:
        default_batch_fetch_size: 50   # turns N+1 collection loads into batched IN (...) queries
        jdbc:
          time_zone: UTC               # store/read Instant columns as UTC regardless of server zone
        format_sql: true
    show-sql: false

  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

app:
  cors:
    allowed-origins: http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: INFO   # set to DEBUG to see every SQL statement
